name: Update Profile Stats

on:
schedule:
- cron: "0 3 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
stats:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Generate GitHub Stats
    uses: readme-tools/github-readme-stats-action@v1
    with:
      card: stats
      options: username=progressaportiy&show_icons=true&theme=github_dark&hide_border=true&rank_icon=github
      path: profile/stats.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate Top Languages
    uses: readme-tools/github-readme-stats-action@v1
    with:
      card: top-langs
      options: username=progressaportiy&layout=compact&theme=github_dark&hide_border=true&langs_count=8
      path: profile/top-langs.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Commit Changes
    run: |
      git config user.name "github-actions"
      git config user.email "github-actions@users.noreply.github.com"
      git add profile/*.svg
      git commit -m "Update profile stats" || exit 0
      git push
