name: Update Profile Stats

on:
schedule:
- cron: "0 3 * * *"
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

permissions:
  contents: write

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Generate Stats
    uses: readme-tools/github-readme-stats-action@v1
    with:
      card: stats
      options: username=progressaportiy&show_icons=true&theme=github_dark&hide_border=true
      path: profile/stats.svg

  - name: Generate Top Languages
    uses: readme-tools/github-readme-stats-action@v1
    with:
      card: top-langs
      options: username=progressaportiy&layout=compact&theme=github_dark&hide_border=true&langs_count=8
      path: profile/top-langs.svg

  - name: Commit Changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add profile/
      git diff --cached --quiet || git commit -m "Update profile stats"
      git push
